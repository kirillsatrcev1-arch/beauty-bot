<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Nail Studio</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/*FONTS*/
@font-face{font-family:"Onest";font-weight:400;font-display:swap;src:url(/static/fonts/onest-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:400;font-display:swap;src:url(/static/fonts/onest-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+20BD,U+2122,U+2212}
@font-face{font-family:"Onest";font-weight:500;font-display:swap;src:url(/static/fonts/onest-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:500;font-display:swap;src:url(/static/fonts/onest-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+20BD,U+2122,U+2212}
@font-face{font-family:"Onest";font-weight:600;font-display:swap;src:url(/static/fonts/onest-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:600;font-display:swap;src:url(/static/fonts/onest-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+20BD,U+2122,U+2212}
@font-face{font-family:"Onest";font-weight:700;font-display:swap;src:url(/static/fonts/onest-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:700;font-display:swap;src:url(/static/fonts/onest-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+20BD,U+2122,U+2212}
@font-face{font-family:"Onest";font-weight:800;font-display:swap;src:url(/static/fonts/onest-cyrillic-800-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Onest";font-weight:800;font-display:swap;src:url(/static/fonts/onest-latin-800-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+20BD,U+2122,U+2212}
@font-face{font-family:"Unbounded";font-weight:700;font-display:swap;src:url(/static/fonts/unbounded-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Unbounded";font-weight:700;font-display:swap;src:url(/static/fonts/unbounded-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+20BD,U+2122,U+2212}

/* Тёмный минимализм: жирная типографика, яркие плитки-направления, синий акцент, плавающая нижняя панель */
:root{
  color-scheme:dark;
  --bg:#0b0b0d; --card:#17171b; --card-2:#202026; --line:rgba(255,255,255,.07);
  --text:#f6f6f8; --muted:#8c8c96; --faint:#4a4a52;
  --accent:#3d7bff; --accent-2:#7a5cff; --pink:#ff6fae;
  --t-coral:#f2594f; --t-lilac:#b98cf5; --t-sun:#f7c843; --t-plum:#5b2367; --t-mint:#bff0d9; --t-cyan:#38d4e6;
  --r:22px; --ease:cubic-bezier(.2,.8,.2,1);
  --display:"Unbounded","Onest",system-ui,sans-serif; --sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px calc(120px + var(--safe-b));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.h1{font:800 32px/1.05 var(--sans);letter-spacing:-.03em;margin:4px 0 14px;text-wrap:balance}
.h2{font:800 22px/1.1 var(--sans);letter-spacing:-.02em;margin:0}
.sec{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.sec .h2{font-size:19px}
.link{font:600 13px/1 var(--sans);color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:999px;background:var(--card);font:700 13.5px/1 var(--sans);color:var(--text);white-space:nowrap;transition:transform .2s var(--ease),background .2s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);color:#fff}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px}
.seg button{height:30px;padding:0 13px;border-radius:999px;font:700 12.5px/1 var(--sans);color:var(--muted);transition:all .2s}
.seg button.on{background:#fff;color:#000}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;border-radius:16px;background:var(--card);margin:12px 0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-weight:500}
.search input::placeholder{color:var(--muted)}

.promo{position:relative;overflow:hidden;border-radius:26px;padding:20px;background:linear-gradient(135deg,#3d6bff 0%,#5b4bff 55%,#7a3dff 100%);min-height:150px}
.promo h3{font:800 22px/1.1 var(--sans);letter-spacing:-.02em;margin:0 0 6px;max-width:64%}
.promo p{margin:0 0 14px;font-size:13px;color:rgba(255,255,255,.82);max-width:62%}
.promo .btn-w{display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;background:#fff;color:#111;font:700 13.5px/1 var(--sans)}
.promo .art{position:absolute;right:-6px;bottom:-14px;width:42%;max-width:170px;pointer-events:none;transform:rotate(12deg)}
.promo .art svg{width:100%;height:auto}
.promo.pink{background:linear-gradient(135deg,#ff5f9e 0%,#c34bff 100%)}

.marquee{overflow:hidden;margin:22px -16px 6px;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee .run{display:inline-flex;gap:22px;animation:run 26s linear infinite;padding-left:16px}
.marquee span{font:700 30px/1.15 var(--display);letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px var(--faint);transition:color .5s,-webkit-text-stroke-color .5s}
.marquee span.hl{color:var(--text);-webkit-text-stroke-color:transparent}
.marquee span.hl2{color:var(--accent);-webkit-text-stroke-color:transparent}
@keyframes run{to{transform:translateX(-50%)}}

.bento{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:78px;grid-auto-flow:dense;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:24px;text-align:left;padding:14px;display:flex;align-items:flex-end;transition:transform .25s var(--ease)}
.tile:active{transform:scale(.97)}
.tile b{position:relative;z-index:2;font:800 19px/1.05 var(--sans);letter-spacing:-.02em;color:#111}
.tile.dark b{color:#fff}
.tile .art{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.28))}
.tile .cnt{position:absolute;top:12px;left:14px;z-index:2;font:700 11px/1 var(--sans);padding:6px 9px;border-radius:999px;background:rgba(0,0,0,.14);color:rgba(0,0,0,.72)}
.tile.dark .cnt{background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.span2{grid-row:span 2}.span3{grid-row:span 3}

.recent{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
.recent button{flex:none;width:64px;text-align:center}
.recent img,.recent .ph{width:64px;height:64px;border-radius:18px;object-fit:cover;background:var(--card)}
.recent span{display:block;font:600 11px/1.2 var(--sans);color:var(--muted);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.works{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.works button{border-radius:20px;overflow:hidden;aspect-ratio:3/4;background:var(--card);opacity:0;animation:rise .5s var(--ease) forwards}
.works img{width:100%;height:100%;object-fit:cover}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.carousel button{flex:none;width:76%;aspect-ratio:4/5;border-radius:26px;overflow:hidden;scroll-snap-align:center;background:var(--card);position:relative}
.carousel img{width:100%;height:100%;object-fit:cover}
.carousel .cap{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 13px/1.25 var(--sans);text-align:left}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:var(--r)}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:var(--card);margin-bottom:10px;width:100%;text-align:left;transition:transform .2s var(--ease)}
.row:active{transform:scale(.985)}
.row .pic{flex:none;width:72px;height:72px;border-radius:16px;overflow:hidden;display:block}
.row .pic img{width:100%;height:100%;object-fit:cover}
.row .body{flex:1;min-width:0;display:block}
.row .t{display:block;font:700 15px/1.25 var(--sans)}
.row .s{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.row .p{display:block;font:800 16px/1 var(--sans);margin-top:8px}
.plus{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font:600 22px/1 var(--sans)}
.heart{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);color:var(--muted);font-size:17px;transition:all .25s var(--ease)}
.heart.on{color:#fff;background:var(--pink)}
.reviews{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.reviews::-webkit-scrollbar{display:none}
.rv{flex:none;width:80%;scroll-snap-align:start;padding:18px}
.rv .stars{color:var(--t-sun);letter-spacing:2px;font-size:13px}
.rv p{margin:8px 0 10px;font:600 16px/1.35 var(--sans)}
.info{padding:16px 18px;display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-bottom:10px}
.info .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--card-2);font-size:19px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:18px;background:var(--accent);color:#fff;font:700 15.5px/1 var(--sans);transition:transform .2s var(--ease),opacity .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{background:var(--card);color:var(--text)}
.btn.sm{min-height:42px;width:auto;padding:0 16px;font-size:13.5px;border-radius:14px}
.btn.danger{background:var(--card);color:#ff6b6b}

.top{display:flex;align-items:center;gap:12px;margin:8px 0 6px}
.back{width:42px;height:42px;flex:none;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:20px}
.steps{display:flex;gap:6px;margin:10px 0 18px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--card-2);transition:background .35s}
.steps i.on{background:var(--accent)}
.sum{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:14px}
.sum .pic{width:52px;height:52px;border-radius:14px;overflow:hidden;flex:none}
.sum .pic img{width:100%;height:100%;object-fit:cover}
.cal{padding:16px 14px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.cal-h b{font:800 18px/1 var(--sans);letter-spacing:-.02em}
.nav{width:38px;height:38px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;font-size:18px}
.nav[disabled]{opacity:.25;pointer-events:none}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{font:700 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 8px}
.day{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font:700 14.5px/1 var(--sans);color:var(--faint);position:relative;transition:all .2s var(--ease)}
.day.free{background:var(--card-2);color:var(--text)}
.day.free::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day.busy{text-decoration:line-through}
.day.past,.day.off{opacity:.45}
.day.sel{background:var(--accent);color:#fff;transform:scale(1.05)}
.day.sel::after{background:#fff}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.time{height:48px;border-radius:14px;background:var(--card);font:700 15px/1 var(--sans);transition:all .2s var(--ease)}
.time.on{background:var(--accent);color:#fff;transform:translateY(-2px)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font:700 12px/1 var(--sans);color:var(--muted);margin:0 0 8px 4px}
.field input,.field textarea{width:100%;border:0;background:var(--card);border-radius:16px;padding:16px;outline:none;resize:none;transition:box-shadow .2s}
.field input:focus,.field textarea:focus{box-shadow:0 0 0 2px var(--accent)}
.err{color:#ff7a7a;font-size:13px;margin:-4px 0 10px 4px}
.ticket{padding:4px 18px}
.tl{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tl:last-child{border:0}
.tl .k{color:var(--muted);flex:none}
.tl .v{font-weight:700;text-align:right}
.done{text-align:center;padding-top:10px}
.done .big{width:96px;height:96px;margin:10px auto 18px;border-radius:32px;background:var(--accent);display:grid;place-items:center;animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.4) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.me{display:flex;align-items:center;gap:14px;margin:10px 0 8px}
.ava{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--accent-2));font:800 22px/1 var(--sans);color:#fff;flex:none}
.bk{padding:16px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font:700 11.5px/1 var(--sans);background:var(--card-2);color:var(--muted)}
.badge.confirmed{background:rgba(61,123,255,.18);color:#8fb2ff}
.badge.pending{background:rgba(247,200,67,.16);color:var(--t-sun)}
.bk .when{font:800 22px/1.1 var(--sans);letter-spacing:-.02em;margin:10px 0 3px}
.bk .acts{display:flex;gap:8px;margin-top:14px}
.hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}

.dock{position:fixed;left:0;right:0;bottom:calc(14px + var(--safe-b));z-index:30;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:999px;background:rgba(30,30,36,.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 18px 40px -12px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.06)}
.dock button{height:52px;min-width:56px;padding:0 14px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#a0a0aa;transition:all .3s var(--ease)}
.dock button svg{width:22px;height:22px}
.dock button em{font:700 10px/1 var(--sans);font-style:normal;display:none}
.dock button.on{background:var(--accent);color:#fff;min-width:76px}
.dock button.on em{display:block}
.dock .mini{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--accent-2));color:#fff;font:800 12px/1 var(--sans)}

.veil{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:86vh;overflow:auto;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + var(--safe-b)) max(20px,env(safe-area-inset-left,0px));background:#141418;border-radius:28px 28px 0 0;transform:translateY(105%);transition:transform .45s var(--ease)}
.sheet.open{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--faint);margin:0 auto 16px}
.sheet .x{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;background:var(--card-2);font-size:14px;color:var(--muted)}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 4px;border-bottom:1px solid var(--line);font:600 15px/1.2 var(--sans);text-align:left}
.opt:last-child{border:0}
.toast{position:fixed;left:50%;top:12px;z-index:60;transform:translate(-50%,-150%);background:#fff;color:#111;padding:12px 18px;border-radius:999px;font:700 13.5px/1.2 var(--sans);transition:transform .45s var(--ease);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.lb{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.lb.open{opacity:1;pointer-events:auto}
.lb .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
.lb .stage img{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center;will-change:transform;user-select:none;-webkit-user-drag:none}
.lb .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px calc(16px + var(--safe-b))}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:2;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
.view{animation:viewin .45s var(--ease)}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.skel{height:84px;border-radius:20px;background:linear-gradient(90deg,var(--card),var(--card-2),var(--card));background-size:200% 100%;animation:sk 1.3s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.adm{padding:14px;margin-bottom:10px}
.adm .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.quiz-opt{display:block;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--card);margin-bottom:8px;font:700 15px/1.2 var(--sans);transition:background .2s}
.quiz-opt:active{background:var(--accent)}
.demo-note{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.demo-note button{flex:none;font:700 12px/1 var(--sans);color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.works button{opacity:1}}
</style>
</head>
<body>
<main class="wrap" id="app"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<nav class="dock" id="dock"></nav>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<div class="lb" id="lb"><button class="x" data-act="lb-close" aria-label="Закрыть">✕</button><div class="stage" id="stage"><img id="lbImg" alt=""></div>
  <div class="bar"><span class="small" id="lbCap"></span><span class="small muted" id="lbN"></span></div></div>

<script>
const tg=window.DEMO_TG||(window.Telegram&&window.Telegram.WebApp)||{initData:"",ready(){},expand(){},openTelegramLink:u=>window.open(u),openLink:u=>window.open(u),close(){}};
try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor("#0b0b0d");tg.setBackgroundColor&&tg.setBackgroundColor("#0b0b0d");tg.setBottomBarColor&&tg.setBottomBarColor("#0b0b0d");tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(e){}
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=(n,from)=>(from?"от ":"")+Number(n).toLocaleString("ru-RU").replace(/,/g," ")+" ₽";
const dur=m=>{const h=Math.floor(m/60),mm=m%60;return h&&mm?`${h} ч ${mm} мин`:h?`${h} ч`:`${mm} мин`};
const MONTHS=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const MONTHS_N=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
const WD=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hdate=(iso,wd=true)=>{const d=new Date(iso+"T12:00:00");return `${d.getDate()} ${MONTHS[d.getMonth()]}`+(wd?`, ${WD[d.getDay()]}`:"")};
const haptic=(t="light")=>{try{tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
const STATUS={pending:["pending","ждёт подтверждения"],confirmed:["confirmed","подтверждена"],done:["","визит состоялся"],cancelled:["","отменена"],expired:["","не подтверждена"]};
const params=new URLSearchParams(location.search);
const store={get(k,d){try{return JSON.parse(localStorage.getItem("ns:"+k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem("ns:"+k,JSON.stringify(v))}catch(e){}}};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
function fmtPhone(raw){let d=String(raw).replace(/\D/g,"");if(d.length===11&&d[0]==="8")d="7"+d.slice(1);if(d.length===10)d="7"+d;
  if(d.length===11&&d[0]==="7")return `+7 ${d.slice(1,4)} ${d.slice(4,7)}-${d.slice(7,9)}-${d.slice(9)}`;return d?"+"+d:raw}

async function realApi(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"X-Init-Data":tg.initData||"","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||j.ok===false){const e=new Error(j.error||"error");e.data=j;e.status=r.status;throw e}
  return j;
}
const api=window.DEMO_API||realApi;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600)}
function sheet(html){$("#sheet").innerHTML='<div class="grab"></div><button class="x" data-act="sheet-close" aria-label="Закрыть">✕</button>'+html;$("#sheet").scrollTop=0;$("#sheet").classList.add("open");$("#veil").classList.add("open")}
function closeSheet(){$("#sheet").classList.remove("open");$("#veil").classList.remove("open")}
$("#veil").onclick=closeSheet;

/* ---------- векторные иллюстрации направлений ---------- */
const ART={
 bottle:(c="#1b4dff")=>`<svg viewBox="0 0 120 170" width="96" height="136"><rect x="44" y="6" width="32" height="70" rx="12" fill="#f3e7d3"/><rect x="50" y="12" width="7" height="56" rx="3.5" fill="#fff" opacity=".7"/>
   <rect x="20" y="70" width="80" height="92" rx="22" fill="#fff" opacity=".8"/><rect x="30" y="82" width="60" height="68" rx="16" fill="${c}"/><rect x="36" y="88" width="10" height="44" rx="5" fill="#fff" opacity=".45"/></svg>`,
 gem:()=>`<svg viewBox="0 0 140 120" width="110" height="94"><polygon points="20,40 45,12 95,12 120,40 70,110" fill="#e9e3ff"/><polygon points="20,40 120,40 70,110" fill="#b7a6ff"/><polygon points="45,12 70,40 95,12" fill="#fff"/><polygon points="20,40 45,12 70,40" fill="#d6ccff"/><polygon points="70,40 95,12 120,40" fill="#cfc4ff"/><polygon points="45,40 70,110 95,40" fill="#9b86ff"/></svg>`,
 brush:(c="#ff3d6e")=>`<svg viewBox="0 0 160 160" width="118" height="118"><g transform="rotate(32 80 80)"><rect x="70" y="40" width="20" height="120" rx="10" fill="#1d1d1d"/><rect x="74" y="44" width="5" height="100" rx="2.5" fill="#fff" opacity=".35"/><rect x="68" y="28" width="24" height="16" rx="4" fill="#d9d9d9"/><path d="M70 28 C70 10 76 -2 80 -6 C84 -2 90 10 90 28 Z" fill="${c}"/></g></svg>`,
 foot:()=>`<svg viewBox="0 0 120 160" width="84" height="112"><ellipse cx="60" cy="102" rx="30" ry="50" fill="#fff" opacity=".93"/>${[[32,42,9],[47,31,8],[62,28,8],[77,32,7],[90,41,6]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*1.25}" fill="#fff" opacity=".93"/><ellipse cx="${x}" cy="${y-r*.45}" rx="${r*.58}" ry="${r*.48}" fill="#ff5f9e"/>`).join("")}</svg>`,
 spark:()=>`<svg viewBox="0 0 140 140" width="104" height="104">${[[70,62,40],[28,30,16],[112,106,18]].map(([x,y,r])=>`<path d="M${x} ${y-r} C${x+r*.18} ${y-r*.18} ${x+r*.18} ${y-r*.18} ${x+r} ${y} C${x+r*.18} ${y+r*.18} ${x+r*.18} ${y+r*.18} ${x} ${y+r} C${x-r*.18} ${y+r*.18} ${x-r*.18} ${y+r*.18} ${x-r} ${y} C${x-r*.18} ${y-r*.18} ${x-r*.18} ${y-r*.18} ${x} ${y-r}Z" fill="#fff"/>`).join("")}</svg>`,
 heart:()=>`<svg viewBox="0 0 140 130" width="104" height="96"><path d="M70 120 C20 86 6 60 10 40 C14 16 44 6 70 34 C96 6 126 16 130 40 C134 60 120 86 70 120Z" fill="#ff5f9e"/><path d="M34 34 C40 24 52 22 60 30" stroke="#fff" stroke-width="8" stroke-linecap="round" fill="none" opacity=".6"/></svg>`
};
const CAT_LOOK={
  mani:{bg:"var(--t-coral)",art:ART.bottle("#1b4dff"),pos:"right:-4px;top:-6px",span:"span3"},
  ext:{bg:"var(--t-lilac)",art:ART.gem(),pos:"right:-10px;top:4px",span:"span2"},
  design:{bg:"var(--t-sun)",art:ART.brush("#ff3d6e"),pos:"right:-18px;top:-14px",span:"span2"},
  pedi:{bg:"var(--t-plum)",art:ART.foot(),pos:"right:4px;top:-10px",span:"span2",dark:1},
  combo:{bg:"var(--t-cyan)",art:ART.heart(),pos:"right:-10px;top:10px",span:"span3"},
  extra:{bg:"var(--t-mint)",art:ART.spark(),pos:"right:-8px;top:-8px",span:"span2"}
};
const lookOf=id=>CAT_LOOK[id]||{bg:"var(--card-2)",art:ART.spark(),pos:"right:0;top:0",span:"span2",dark:1};
const picHtml=s=>s.photo?`<img src="${s.photo}" loading="lazy" alt="">`:`<span style="width:100%;height:100%;display:grid;place-items:center;background:${lookOf(s.category).bg};overflow:hidden"><span style="transform:scale(.5);display:block">${lookOf(s.category).art}</span></span>`;

/* ---------- состояние ---------- */
const S={boot:null,tab:params.get("tab")||"home",cat:null,q:"",pf:{s:params.get("s")||null,items:[],view:store.get("pfview","grid"),loading:false},b:null,my:null,adm:{data:null}};
const ICON={
 home:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2.2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2.2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2.2"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>',
 book:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2.5a1 1 0 0 1 1 1V5h8V3.5a1 1 0 1 1 2 0V5h.5A2.5 2.5 0 0 1 21 7.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-11A2.5 2.5 0 0 1 5.5 5H6V3.5a1 1 0 0 1 1-1ZM5 10v8.5c0 .3.2.5.5.5h13c.3 0 .5-.2.5-.5V10H5Z"/></svg>'
};
const searchIcon='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.5-4.5"/></svg>';
function renderDock(){
  const init=esc(((S.boot&&S.boot.user.name)||"Я")[0].toUpperCase());
  const items=[["home","Главная",ICON.home],["services","Услуги",ICON.search],["book","Запись",ICON.book],["me","Профиль",`<span class="mini">${init}</span>`]];
  $("#dock").innerHTML='<div class="in">'+items.map(([k,l,i])=>`<button class="${S.tab===k?"on":""}" data-tab="${k}" aria-label="${l}">${i}<em>${l}</em></button>`).join("")+"</div>";
}
function go(tab){S.tab=tab;haptic();renderDock();render();window.scrollTo({top:0,behavior:"instant"})}

/* ---------- главная ---------- */
const WORDS=["Маникюр","Педикюр","Наращивание","Френч","Втирка","Дизайн","Покрытие","Укрепление"];
let marqueeTimer;
function vHome(){
  const st=S.boot.studio, cats=S.boot.categories.filter(c=>S.boot.services.some(s=>s.category===c.id));
  const recent=store.get("recent",[]).map(id=>S.boot.services.find(s=>s.id===id)).filter(Boolean);
  const rv=S.boot.reviews;
  const words=[...WORDS,...WORDS].map((w,i)=>`<span data-w="${i%WORDS.length}">${w}</span>`).join("");
  return `<div class="view">
  ${window.DEMO_API?`<div class="demo-note"><span>Демо: данные примерные, записи хранятся только на этом устройстве</span><button data-act="reset">Сбросить</button></div>`:""}
  <div class="small muted" style="margin-top:8px">${esc(st.name||"Nail studio")} · мастер ${esc(st.master)}</div>
  <h1 class="h1">Запишись на&nbsp;ноготочки</h1>
  <div class="chips">
    <button class="chip on" data-act="free-today">Свободно сегодня</button>
    <button class="chip" data-act="free-tomorrow">Завтра</button>
    <button class="chip" data-act="nearest">Ближайшее окно</button>
    <button class="chip" data-tab="services">Прайс</button>
  </div>
  <label class="search">${searchIcon}<input id="q" type="search" placeholder="Услуга, дизайн или цвет" enterkeyhint="search" autocomplete="off"></label>
  <div class="promo"><h3>Не знаешь, что выбрать?</h3><p>Три вопроса — и подберу процедуру и свободное время</p>
    <button class="btn-w" data-act="quiz">Подобрать</button><div class="art">${ART.bottle("#ff5f9e")}</div></div>
  <div class="marquee" aria-hidden="true"><div class="run" id="run">${words}</div></div>
  <div class="sec"><h2 class="h2">Направления</h2><button class="link" data-tab="services">Все услуги</button></div>
  <div class="bento">${cats.map(c=>{const L=lookOf(c.id),n=S.boot.services.filter(s=>s.category===c.id).length;
    return `<button class="tile ${L.span} ${L.dark?"dark":""}" style="background:${L.bg}" data-cat="${c.id}"><span class="cnt">${n} ${plural(n,"услуга","услуги","услуг")}</span><span class="art" style="${L.pos}">${L.art}</span><b>${esc(c.title)}</b></button>`}).join("")}</div>
  ${recent.length?`<div class="sec"><h2 class="h2">Недавно смотрели</h2><button class="link" data-act="clear-recent">Очистить</button></div>
   <div class="recent">${recent.map(s=>`<button data-svc="${s.id}">${s.photo?`<img src="${s.photo}" alt="">`:`<div class="ph" style="background:${lookOf(s.category).bg}"></div>`}<span>${esc(s.title)}</span></button>`).join("")}</div>`:""}
  <div class="sec"><h2 class="h2">Мои работы</h2><div class="seg"><button class="${S.pf.view==="grid"?"on":""}" data-pfview="grid">Сетка</button><button class="${S.pf.view==="carousel"?"on":""}" data-pfview="carousel">Карусель</button></div></div>
  <div class="chips" style="margin-bottom:12px">${S.boot.portfolio.map(p=>`<button class="chip ${p.id===S.pf.s?"on":"ghost"}" data-pf="${p.id}">${esc(p.title)}${p.count?` · ${p.count}`:""}</button>`).join("")}</div>
  <div id="works">${worksHtml()}</div>
  <div style="height:28px"></div>
  <div class="promo pink"><h3>Свободные окошки — первыми</h3><p>Новые работы, акции и окна в последний момент — в моём канале</p>
    <button class="btn-w" data-act="channel">Открыть канал</button><div class="art">${ART.heart()}</div></div>
  ${rv.length?`<div class="sec"><h2 class="h2">Отзывы</h2><span class="link">${rv.length}</span></div><div class="reviews">${rv.map(r=>`<div class="card rv"><div class="stars">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</div><p>${esc(r.text||"Всё супер!")}</p><div class="small muted">${esc(r.name||"Клиентка")}</div></div>`).join("")}</div>`:""}
  <div class="sec"><h2 class="h2">Студия</h2></div>
  <button class="card info" data-act="about"><span class="ic">🤍</span><span><b>${esc(st.master)}</b><br><span class="small muted">Обо мне, опыт и материалы</span></span></button>
  <button class="card info" data-act="map"><span class="ic">📍</span><span><b>${esc(st.address)}</b><br><span class="small muted">${esc(st.address_hint)}</span></span></button>
  <button class="card info" data-act="contact"><span class="ic">💬</span><span><b>Написать мастеру</b><br><span class="small muted">Отвечу в Telegram</span></span></button>
  </div>`;
}
function worksHtml(){
  if(S.pf.loading)return '<div class="works"><div class="skel" style="height:200px"></div><div class="skel" style="height:200px"></div></div>';
  const it=S.pf.items;
  if(!it.length)return `<div class="card empty">Скоро здесь появятся работы этого раздела</div>`;
  if(S.pf.view==="carousel")return `<div class="carousel">${it.map((x,i)=>`<button data-open="${i}"><img src="${x.src}" loading="lazy" alt="">${x.caption?`<span class="cap">${esc(x.caption)}</span>`:""}</button>`).join("")}</div>`;
  return `<div class="works">${it.map((x,i)=>`<button data-open="${i}" style="animation-delay:${Math.min(i,8)*.05}s"><img src="${x.src}" loading="lazy" alt=""></button>`).join("")}</div>`;
}
function startMarquee(){
  clearInterval(marqueeTimer);let k=0;
  const tick=()=>{const spans=document.querySelectorAll("#run span");if(!spans.length)return clearInterval(marqueeTimer);
    spans.forEach(s=>{const w=+s.dataset.w;s.className=w===k%WORDS.length?"hl":w===(k+3)%WORDS.length?"hl2":""});k++};
  tick();marqueeTimer=setInterval(tick,1400);
}
async function loadPf(sec){
  S.pf.s=sec;S.pf.loading=true;S.pf.items=[];if(S.tab==="home")patchWorks();
  try{S.pf.items=(await api(`/api/portfolio?s=${sec}`)).items}catch(e){S.pf.items=[]}
  S.pf.loading=false;if(S.tab==="home")patchWorks();
}
function patchWorks(){const w=$("#works");if(w)w.innerHTML=worksHtml();document.querySelectorAll("[data-pf]").forEach(b=>b.className="chip "+(b.dataset.pf===S.pf.s?"on":"ghost"))}

/* ---------- услуги ---------- */
function svcRow(s){
  const fav=S.boot.favorites.includes(s.id);
  return `<div class="row"><button class="pic" data-svc="${s.id}" aria-label="Подробнее">${picHtml(s)}</button>
   <button class="body" style="text-align:left" data-svc="${s.id}"><span class="t">${esc(s.title)}</span><span class="s">${dur(s.duration)}</span><span class="p">${rub(s.price,s.price_from)}</span></button>
   <button class="heart ${fav?"on":""}" data-fav="${s.id}" aria-label="В избранное">${fav?"♥":"♡"}</button>
   <button class="plus" data-booksvc="${s.id}" aria-label="Записаться">+</button></div>`;
}
function svcList(){
  let list=S.boot.services;
  if(S.cat==="_fav")list=list.filter(s=>S.boot.favorites.includes(s.id));
  else if(S.cat)list=list.filter(s=>s.category===S.cat);
  const q=S.q.trim().toLowerCase();
  if(q)list=list.filter(s=>(s.title+" "+s.description).toLowerCase().includes(q));
  return list.map(svcRow).join("")||`<div class="card empty">Ничего не нашлось. Попробуй другое слово</div>`;
}
function vServices(){
  const cats=S.boot.categories.filter(c=>S.boot.services.some(s=>s.category===c.id));
  return `<div class="view"><h1 class="h1" style="margin-top:10px">Услуги</h1>
  <label class="search" style="margin-top:0">${searchIcon}<input id="q2" type="search" value="${esc(S.q)}" placeholder="Услуга, дизайн или цвет" autocomplete="off"></label>
  <div class="chips" style="margin-bottom:14px"><button class="chip ${!S.cat?"on":""}" data-filter="">Все</button>
   ${cats.map(c=>`<button class="chip ${S.cat===c.id?"on":""}" data-filter="${c.id}">${esc(c.title)}</button>`).join("")}
   ${S.boot.favorites.length?`<button class="chip ${S.cat==="_fav"?"on":""}" data-filter="_fav">♥ Избранное</button>`:""}</div>
  <div id="svcList">${svcList()}</div></div>`;
}
function showService(id){
  const s=S.boot.services.find(x=>x.id===id);if(!s)return;
  const r=store.get("recent",[]).filter(x=>x!==id);r.unshift(id);store.set("recent",r.slice(0,8));
  const fav=S.boot.favorites.includes(id);
  sheet(`<div style="border-radius:22px;overflow:hidden;height:210px;margin-bottom:16px">${s.photo?`<img src="${s.photo}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div style="height:100%;display:grid;place-items:center;background:${lookOf(s.category).bg}">${lookOf(s.category).art}</div>`}</div>
   <h2 class="h2" style="font-size:24px;margin-bottom:8px">${esc(s.title)}</h2>
   <p class="muted" style="margin:0 0 16px">${esc(s.description)}</p>
   <div style="display:flex;gap:8px;margin-bottom:18px"><span class="chip" style="display:inline-flex;align-items:center">${rub(s.price,s.price_from)}</span><span class="chip ghost" style="display:inline-flex;align-items:center">${dur(s.duration)}</span></div>
   <div style="display:flex;gap:8px"><button class="btn" data-booksvc="${s.id}">Записаться</button><button class="heart ${fav?"on":""}" style="width:56px;height:56px;border-radius:18px" data-fav="${s.id}" aria-label="В избранное">${fav?"♥":"♡"}</button></div>`);
}

/* ---------- запись ---------- */
function newBooking(extra={}){S.b={step:0,svc:null,ym:null,month:null,date:null,time:null,slots:null,name:S.boot.user.name||"",phone:S.boot.user.phone||"",comment:"",resched:null,done:null,err:null,...extra}}
function stepsBar(n){const total=S.b.resched?1:4;const cur=S.b.resched?0:n;return `<div class="steps">${Array.from({length:total},(_,i)=>`<i class="${i<=cur?"on":""}"></i>`).join("")}</div>`}
function bookTop(title){return `<div class="top">${S.b.step>0||S.b.resched?`<button class="back" data-act="b-back" aria-label="Назад">‹</button>`:""}<h1 class="h1" style="margin:0">${title}</h1></div>`}
function svcSum(){const s=S.b.svc;return `<div class="card sum"><span class="pic">${picHtml(s)}</span><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(s.title)}</div><div class="small muted">${dur(s.duration)}${S.b.date?` · ${hdate(S.b.date,false)}`:""}${S.b.time?` в ${S.b.time}`:""}</div></div><div style="font-weight:800;white-space:nowrap">${rub(s.price,s.price_from)}</div></div>`}
function vBook(){
  if(!S.b)newBooking();
  const b=S.b;
  if(b.done)return vDone();
  if(b.step===0){
    const cats=S.boot.categories.filter(c=>S.boot.services.some(s=>s.category===c.id));

/* ---------- лайтбокс: свайп, pinch-zoom, двойной тап ---------- */
const LB={i:0,scale:1,x:0,y:0,pts:new Map(),start:null,lastTap:0};
function lbOpen(i){LB.i=i;lbShow();$("#lb").classList.add("open")}
function lbClose(){$("#lb").classList.remove("open")}
function lbShow(){const it=S.pf.items[LB.i];if(!it)return;LB.scale=1;LB.x=0;LB.y=0;$("#lbImg").src=it.orig||it.src;lbApply();$("#lbCap").textContent=it.caption||"";$("#lbN").textContent=`${LB.i+1} / ${S.pf.items.length}`}
function lbApply(anim){const img=$("#lbImg");img.style.transition=anim?"transform .3s cubic-bezier(.2,.8,.2,1)":"none";img.style.transform=`translate(calc(-50% + ${LB.x}px),calc(-50% + ${LB.y}px)) scale(${LB.scale})`}
const stage=$("#stage");
stage.addEventListener("pointerdown",e=>{stage.setPointerCapture(e.pointerId);LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(LB.pts.size===1)LB.start={x:e.clientX,y:e.clientY,ox:LB.x,oy:LB.y,t:Date.now()};
  if(LB.pts.size===2){const [a,b]=[...LB.pts.values()];LB.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:LB.scale}}});
stage.addEventListener("pointermove",e=>{if(!LB.pts.has(e.pointerId))return;LB.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(LB.pts.size===2&&LB.pinch){const [a,b]=[...LB.pts.values()];LB.scale=Math.min(5,Math.max(1,LB.pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/LB.pinch.d));lbApply()}
  else if(LB.pts.size===1&&LB.start){const dx=e.clientX-LB.start.x,dy=e.clientY-LB.start.y;if(LB.scale>1){LB.x=LB.start.ox+dx;LB.y=LB.start.oy+dy}else{LB.x=dx;LB.y=Math.abs(dy)>Math.abs(dx)?dy:0}lbApply()}});
function lbEnd(e){LB.pts.delete(e.pointerId);if(LB.pts.size)return;LB.pinch=null;const s=LB.start;LB.start=null;if(!s)return;
  const dx=e.clientX-s.x,dy=e.clientY-s.y,now=Date.now();
  if(Math.abs(dx)<8&&Math.abs(dy)<8&&now-s.t<250){if(now-LB.lastTap<300){LB.scale=LB.scale>1?1:2.5;LB.x=0;LB.y=0;lbApply(true);LB.lastTap=0;return}LB.lastTap=now;return}
  if(LB.scale>1)return;
  const n=S.pf.items.length;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)){LB.i=(LB.i+(dx<0?1:-1)+n)%n;haptic();lbShow();return}
  if(dy>110){lbClose();return}
  LB.x=0;LB.y=0;lbApply(true)}
stage.addEventListener("pointerup",lbEnd);stage.addEventListener("pointercancel",lbEnd);

}
function bBack(){const b=S.b;if(!b)return;if(b.step===4)b.step=3;else if(b.step===3)b.step=2;else{if(b.resched){go("me");return}b.step=0;b.date=null;b.time=null}render()}
if(tg.BackButton&&tg.BackButton.onClick)tg.BackButton.onClick(()=>{if($("#lb").classList.contains("open"))return lbClose();if(S.tab==="book")bBack()});

document.addEventListener("input",e=>{if(e.target.id==="q2"){S.q=e.target.value;const l=$("#svcList");if(l)l.innerHTML=svcList()}});
document.addEventListener("keydown",e=>{if(e.target.id==="q"&&e.key==="Enter"){S.q=e.target.value;S.cat=null;go("services")}});
document.addEventListener("change",e=>{if(e.target.id==="q"&&e.target.value.trim()){S.q=e.target.value;S.cat=null;go("services")}});

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-tab]");if(!t)return;const ds=t.dataset;
  if(ds.tab){closeSheet();if(ds.tab==="book"&&S.b&&S.b.done)newBooking();if(ds.tab==="services"&&t.closest(".dock")){S.q="";S.cat=null}go(ds.tab);return}
  if(ds.cat){S.cat=ds.cat;S.q="";go("services");return}
  if(ds.filter!==undefined){S.cat=ds.filter||null;haptic();render();return}
  if(ds.svc){showService(+ds.svc);return}
  if(ds.booksvc){pickService(+ds.booksvc);return}
  if(ds.pick){pickService(+ds.pick);return}
  if(ds.fav){const id=+ds.fav;haptic();try{const r=await api("/api/favorite",{service:id});S.boot.favorites=r.favorite?[...S.boot.favorites,id]:S.boot.favorites.filter(x=>x!==id);toast(r.favorite?"Добавлено в избранное":"Убрано из избранного");
    if($("#sheet").classList.contains("open")&&t.closest("#sheet"))showService(id);render()}catch(err){}return}
  if(ds.pf){haptic();loadPf(ds.pf);return}
  if(ds.pfview){S.pf.view=ds.pfview;store.set("pfview",S.pf.view);document.querySelectorAll("[data-pfview]").forEach(b=>b.classList.toggle("on",b.dataset.pfview===S.pf.view));patchWorks();return}
  if(ds.open!==undefined){lbOpen(+ds.open);return}
  if(ds.month){loadMonth(shiftYm(S.b.ym,+ds.month));return}
  if(ds.day){S.b.date=ds.day;S.b.time=null;S.b.step=1;haptic();loadSlots();return}
  if(ds.time){S.b.time=ds.time;S.b.step=2;haptic();render();setTimeout(()=>{const n=$('[data-act="b-next"]');n&&n.scrollIntoView({behavior:"smooth",block:"center"})},50);return}
  if(ds.quick){const [id,iso,tm]=ds.quick.split("|");pickService(+id,{date:iso,time:tm});return}
  if(ds.quiz){const [st,a]=ds.quiz.split("|");haptic();quiz(+st,a.split(","));return}
  if(ds.quizgo){const [id,when]=ds.quizgo.split("|");if(when==="any"){pickService(+id);return}
    const d=new Date();d.setDate(d.getDate()+(+when));const iso=isoOf(d);let slots=[];try{slots=(await api(`/api/slots?service=${id}&date=${iso}`)).slots}catch(err){}
    if(slots.length)pickService(+id,{date:iso});else{toast("На этот день окон нет — выбери другой");pickService(+id)}return}
  if(ds.resched){closeSheet();const b=S.my.active.find(x=>x.id===+ds.resched);newBooking({resched:b.id,step:1,svc:{id:b.service_id,title:b.service_title,price:b.price,price_from:b.price_from,duration:b.duration,category:(S.boot.services.find(s=>s.id===b.service_id)||{}).category,photo:(S.boot.services.find(s=>s.id===b.service_id)||{}).photo}});S.tab="book";renderDock();render();loadMonth();return}
  if(ds.cancel){const id=+ds.cancel;sheet(`<h2 class="h2" style="font-size:24px;margin:4px 40px 10px 0">Отменить запись?</h2><p class="muted" style="margin:0 0 18px">Окно освободится для других. Может, лучше перенести?</p>
     <button class="btn" data-resched="${id}">Перенести</button><button class="btn danger" style="margin-top:10px" data-cancelyes="${id}">Да, отменить</button>`);return}
  if(ds.cancelyes){closeSheet();try{await api("/api/cancel",{id:+ds.cancelyes});toast("Запись отменена");S.my=null;render()}catch(err){toast(err.message==="too_late"?"До визита мало времени — напиши мастеру":"Не получилось отменить")}return}
  if(ds.admday){S.adm.data.date=ds.admday;loadAdmin(ds.admday);return}
  if(ds.adm){const [action,id]=ds.adm.split(":");
    if(action==="cancel"&&!t.dataset.sure){t.dataset.sure="1";t.textContent="Точно отменить?";return}
    try{await api("/api/admin/action",{id:+id,action});toast("Готово");loadAdmin(S.adm.data.date)}catch(err){toast("Ошибка")}return}
  const st=S.boot&&S.boot.studio;
  switch(ds.act){
    case "sheet-close":closeSheet();break;
    case "reset":window.DEMO_RESET&&window.DEMO_RESET();break;
    case "free-today":quickSlots(0);break;
    case "free-tomorrow":quickSlots(1);break;
    case "nearest":nearest();break;
    case "quiz":quiz();break;
    case "clear-recent":store.set("recent",[]);render();break;
    case "channel":st.channel_url?tg.openTelegramLink(st.channel_url):toast("Канал скоро появится");break;
    case "about":sheet(`<div style="border-radius:22px;overflow:hidden;height:220px;margin-bottom:16px"><img src="${st.images.about}" alt="" style="width:100%;height:100%;object-fit:cover"></div><h2 class="h2" style="font-size:24px;margin-bottom:10px">${esc(st.master)}</h2>
      <div class="muted" style="font-size:14.5px">${(st.about||"").split("\n").filter(Boolean).map(l=>`<p style="margin:0 0 10px">${l}</p>`).join("")}</div><button class="btn" style="margin-top:8px" data-tab="book">Записаться</button>`);break;
    case "map":sheet(`<h2 class="h2" style="font-size:24px;margin:4px 40px 10px 0">Адрес студии</h2><p style="margin:0 0 6px;font-weight:700">${esc(st.address)}</p><p class="muted" style="margin:0 0 18px">${esc(st.address_hint)}</p>
      ${st.map_url?`<button class="btn" data-act="open-map">Открыть на карте</button>`:""}`);break;
    case "open-map":tg.openLink(st.map_url);break;
    case "contact":sheet(`<h2 class="h2" style="font-size:24px;margin:4px 40px 10px 0">Написать мастеру</h2><p class="muted" style="margin:0 0 18px">${esc(st.contact_text)}</p>
      ${st.contact_username?`<button class="btn" data-act="tg-contact">Написать в Telegram</button>`:""}
      ${st.contact_phone?`<p style="margin:14px 0 0;text-align:center;font-weight:700;user-select:all">${esc(st.contact_phone)}</p>`:""}
      <button class="btn ghost" style="margin-top:10px" data-act="close-app">Написать в чате бота</button>`);break;
    case "tg-contact":tg.openTelegramLink("https://t.me/"+st.contact_username);break;
    case "close-app":tg.close();break;
    case "lb-close":lbClose();break;
    case "b-back":bBack();break;
    case "b-again":newBooking();go("home");break;
    case "b-next":if(S.b.resched)submit();else{S.b.step=3;render();window.scrollTo({top:0})}break;
    case "b-contacts":{const b=S.b;b.name=$("#fName").value.trim();b.phone=fmtPhone($("#fPhone").value.trim());b.comment=$("#fComment").value.trim();
      const digits=b.phone.replace(/\D/g,"");b.err=b.name.length<2?"Напиши, пожалуйста, имя":digits.length<11||digits.length>15?"Проверь номер телефона":null;
      if(!b.err){b.step=4;window.scrollTo({top:0})}render();break}
    case "b-submit":submit();break;
    case "sub-open":tg.openTelegramLink(t.dataset.url);break;
    case "sub-check":try{const r=await api("/api/sub",{});if(r.subscribed){closeSheet();toast("Спасибо за подписку!");submit()}else toast("Подписки пока нет")}catch(err){}break;
  }
});

(async function init(){
  try{S.boot=await api("/api/bootstrap")}catch(e){
    app.innerHTML=`<div class="view" style="text-align:center;padding-top:30vh"><h1 class="h1">Открой меня в Telegram</h1><p class="muted">Это приложение работает внутри бота.</p></div>`;return}
  if(!S.pf.s){const first=S.boot.portfolio.find(p=>p.count)||S.boot.portfolio[0];S.pf.s=first&&first.id}
  renderDock();render();
  if(S.pf.s)loadPf(S.pf.s);
})();
</script>
</body>
</html>
